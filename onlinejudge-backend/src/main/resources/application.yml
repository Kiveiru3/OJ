server:
  port: 8082
  servlet:
    context-path: /api
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  application:
    name: OnlineJudge
  
  # 日志配置
  output:
    ansi:
      enabled: always
  
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/onlinejudge?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: root
  
  redis:
    host: localhost
    port: 6379
    database: 0
    timeout: 3000
    lettuce:
      pool:
        max-active: 8
        max-idle: 8
        min-idle: 0

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration
    encoding: UTF-8

logging:
  level:
    com.academic.oj: DEBUG
    org.springframework.security: DEBUG
    root: INFO

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# JWT 配置
jwt:
  secret: OnlineJudgeSecretKey2024ForAcademicProjectThisIsAVeryLongSecretKeyForHS512AlgorithmMustBeAtLeast64CharactersLongAndSecureEnough
  expiration: 86400000  # 24小时，单位：毫秒

# 文件上传配置
file:
  upload-path: ./uploads

# 判题配置
judge:
  timeout: 5000  # 超时时间（毫秒）
  time-limit-scale-percent: 150  # 判题时间按比例放大（150%）
  time-limit-extra-ms: 800  # 额外时间补偿，吸收运行环境开销（毫秒）
  max-memory: 256  # 最大内存（MB）
  max-concurrent-runs: 4  # 同时判题并发数
  queue-capacity: 200  # 判题任务队列长度
  retry:
    max-attempts: 2  # 判题遇到系统性异常时最大重试次数
    backoff-ms: 200  # 每次重试间隔（毫秒）
  java-compiler: javac
  java-runtime: java
  cpp-compiler: g++
  python-runtime: python
  sandbox:
    enabled: true
    strict: false
    docker-binary: docker
    java-image: eclipse-temurin:17-jdk
    cpp-image: gcc:13
    python-image: python:3.11-alpine
    cpus: "1.0"
    pids-limit: 128
    tmpfs-size: 64m
    compile-timeout: 15000

rate-limit:
  enabled: true
  login-per-minute: 30
  submit-per-minute: 20

